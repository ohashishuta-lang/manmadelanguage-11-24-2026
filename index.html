<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b36"><title>Conlang Studio — 学習環境</title><style>
:root{--ink:#172b36;--muted:#64747a;--paper:#f5f5f0;--white:#fff;--line:#dee4e1;--green:#246b56;--mint:#e1eee6;--warn:#a04439;--shadow:0 5px 20px #172b3609}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #82b5a2;outline-offset:2px}button:disabled{cursor:default;opacity:.5}a{color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,3.4vw,39px);line-height:1.2;letter-spacing:-.035em}h2{font-size:21px;line-height:1.4}h3{font-size:16px}small,.muted{color:var(--muted)}.shell{max-width:1200px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{background:#172b36;color:white;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:25px}.brand{font-size:24px;line-height:1.1;letter-spacing:-.055em;font-weight:750}.brand small{display:block;color:#a6c3bb;font-size:11px;letter-spacing:.12em;margin-top:9px}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:8px;background:none;text-align:left;color:#c9d7d8;padding:10px 12px;font-size:14px}.nav button.active{background:#315147;color:#fff;font-weight:700}.nav button:hover{background:#29463e;color:white}.sidefoot{margin-top:auto;color:#a6c3bb;font-size:12px}.main{padding:34px clamp(16px,4vw,48px) 50px;min-width:0}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;color:var(--green);text-transform:uppercase;margin-bottom:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}.tag{font-size:11px;white-space:nowrap;border:1px solid var(--line);border-radius:20px;background:#fff;padding:5px 10px;color:var(--muted)}.lead{color:var(--muted);margin-top:10px;max-width:65ch}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow)}.stack{display:grid;gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:17px;background:white;border:1px solid var(--line);border-radius:12px}.metric strong{font-size:29px;display:block;line-height:1.3;font-variant-numeric:tabular-nums}.metric small{font-size:12px}.bar{height:8px;border-radius:9px;background:#e9eeeb;overflow:hidden;margin:12px 0 6px}.bar span{display:block;height:100%;background:var(--green);border-radius:9px}.primary,.secondary,.audio,.chip{border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:white;color:var(--ink);font-weight:650}.primary{color:#fff;background:var(--green);border-color:var(--green)}.primary:hover{background:#18523f}.secondary:hover,.audio:hover,.chip:hover{background:var(--mint)}.audio{padding:6px 10px;white-space:nowrap;font-size:13px;flex-shrink:0}.actions,.between{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.sectionhead{margin:10px 0 0}.lesson{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px}.num{width:42px;height:42px;border-radius:10px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:800}.lesson p{color:var(--muted);font-size:13px}.lesson-head{padding-bottom:15px;border-bottom:1px solid var(--line)}.words{display:grid;gap:0}.word{display:grid;grid-template-columns:minmax(110px,1fr) minmax(115px,1.2fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef0ee}.word:last-child{border-bottom:0}.word strong{font-size:20px;letter-spacing:.005em}.word small{display:block;font-size:12px;overflow-wrap:anywhere}.word .meaning{font-size:15px}.word .origin{font-size:10px;color:var(--muted);display:inline-block;margin-left:5px}.word-controls{display:flex;gap:6px;align-items:center}.tiny{font-size:12px;padding:6px 9px}.search{display:grid;grid-template-columns:minmax(0,1fr) 135px;gap:8px}input,select,textarea{color:var(--ink);border:1px solid #cfd9d4;border-radius:8px;padding:10px 12px;background:white;width:100%;min-width:0}textarea{resize:vertical;min-height:100px}label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field{display:grid;gap:5px}.phrase{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.phrase:last-child{border-bottom:none}.phrase strong{font-size:19px}.phrase small{display:block}.cardcenter{text-align:center;min-height:240px;display:grid;align-content:center;justify-items:center;gap:12px}.bigword{font-size:clamp(30px,6vw,50px);font-weight:750;line-height:1.2;overflow-wrap:anywhere}.flashanswer{min-height:75px}.wide{width:100%}.options{display:grid;gap:9px}.option{text-align:left;border:1px solid #d7dfdb;background:white;color:var(--ink);border-radius:10px;padding:12px 15px}.option:hover{background:var(--mint)}.option.right{background:#e5f2e9;border-color:#4d9871}.option.wrong{background:#f9e9e5;border-color:#bc7468}.option:disabled{opacity:1}.feedback{padding:12px;border-radius:8px;background:var(--mint);font-size:14px}.feedback.bad{background:#f7e7e3;color:#853e34}.note{background:#f0f3f0;border-radius:9px;padding:12px 14px;color:#4c635c;font-size:13px}.rule{border-bottom:1px solid var(--line);padding:14px 0}.rule:last-child{border:0}.rule h3{margin-bottom:5px}.rule p{font-size:14px;color:#445a5f}.tabs{display:flex;gap:7px;flex-wrap:wrap}.chip.active{background:var(--mint);border-color:#a5c5b5;color:var(--green)}.output{min-height:75px;border-radius:10px;padding:14px;background:#f1f5f1;overflow-wrap:anywhere}.output strong{font-size:21px;display:block}.notice{font-size:12px;color:var(--muted);margin-top:6px}.alphabet{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.alphabet div{border:1px solid var(--line);border-radius:7px;text-align:center;padding:5px;font-size:18px;font-weight:700}.alphabet small{display:block;font-size:11px}.check{display:flex;align-items:center;gap:7px;font-size:14px;margin:0}.check input{width:auto}.lesson .primary,.lesson .secondary{font-size:13px}.footerline{border-top:1px solid var(--line);padding-top:12px;margin-top:5px}.hide{display:none!important}.rightside{text-align:right}.spaced{margin-top:12px}.nowrap{white-space:nowrap}
@media(max-width:760px){.shell{display:block}.sidebar{position:static;height:auto;padding:17px;gap:13px}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{flex-shrink:0;padding:8px 10px;font-size:12px}.sidefoot{display:none}.brand{font-size:22px}.brand small{display:none}.main{padding:22px 13px 40px}.grid2{grid-template-columns:1fr}.grid3{gap:6px}.metric{padding:10px}.metric strong{font-size:23px}.metric small{font-size:10px}.panel{padding:14px}.word{grid-template-columns:minmax(85px,1fr) minmax(85px,1fr) auto;gap:6px}.word strong{font-size:17px}.word small{font-size:10px}.word .meaning{font-size:13px}.word-controls{flex-direction:column}.word .audio,.word .tiny{font-size:11px;padding:4px 7px}.search{grid-template-columns:1fr 105px}.lesson{grid-template-columns:32px 1fr auto;gap:8px}.num{width:32px;height:32px}.lesson h3{font-size:14px}.lesson p{font-size:11px}.lesson .primary,.lesson .secondary{padding:6px 8px;font-size:12px}.alphabet{grid-template-columns:repeat(7,1fr)}.top{margin-bottom:16px}.tag{font-size:10px}.bigword{font-size:38px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Conlang<br>Studio<small>LANGUAGE LAB / 01</small></div><nav class="nav" id="nav"></nav><div class="sidefoot">学習用暫定標準 v0.1<br>音声・辞書を内蔵<br>ネット接続不要</div></aside><main class="main" id="main"></main></div><script>
const DATA={"language_name":"未命名","version":"0.1","status":"学習用暫定標準。既出＝以前の会話に登場した語、新案＝本版で新設。過去の演説は試作で未登録語を含む。","alphabet":"A Ä B C D E F G H I J K L M N O Ö P R S T U Ü V W Z","rules":[{"title":"文字と音韻","body":"標準26文字：A Ä B C D E F G H I J K L M N O Ö P R S T U Ü V W Z。母音8種：a /a/, ä /ɛ/, e /e/, i /i/, o /o/, ö /ø/, u /u/, ü /y/。同じ母音を2つ書くと長母音。ei /aɪ̯/, ai /ɛə̯/, au /aʊ̯/, eu /ɔʏ̯/, oi /oɪ̯/。thae の ae は /eː/ とする（既出語の例外）。"},{"title":"子音とアクセント","body":"b d f g h k l m n p s t v w は基本的に IPA と同じ（v はヴ、w はワ）。j /j/, r /ʁ/, z /ts/, sch /ʃ/, th /θ/, ng /ŋ/。ch は a・o・u・au（長母音を含む）の直後で /x/、それ以外は /ç/。語頭 st /ʃt/、sp /ʃp/。c は ch・sch の一部のみ。語末の有声子音を維持する。語根の最初の音節に強勢。無強勢の語末音節の e は /ə/ になりうる。重子音は一つの子音として読む。カナは近似。"},{"title":"基本語順","body":"主語＋動詞＋目的語（SVO）。人称・単複による動詞変化なし。代名詞は主語・目的語で同形。文頭を大文字にし、普通名詞は小文字。例：Ek leiv dair.（私はあなたを愛している。）"},{"title":"名詞・冠詞・形容詞","body":"名詞に性はない。複数は名詞に -er を付ける。定冠詞 thae、不定冠詞 en（単数のみ）。冠詞なしも可能。形容詞は名詞の前に置く。例：en niir buur（新しい本一冊）、fränder（友達たち）。"},{"title":"時制と進行","body":"現在は辞書形。末尾 -en の動詞（4文字以上）は -en を除いた語幹に -ed（過去）、-ar（未来）、-ing（現在進行）を付ける。他の動詞は辞書形に直接付ける。例：trelven / trelved / trelvar / trelving、leiv / leived / leivar / leiving。現在進行は進行中の動作に使う。"},{"title":"否定・疑問","body":"否定は動詞の直前に ne。疑問文は先頭に ka を加え、語順は変えない。例：Ek ne vesen.（私は知らない。）Ka dair trelven?（あなたは話しますか？）"},{"title":"その他","body":"sen は「〜である」。現在 sen、過去 sened、未来 senar。形容詞・名詞を補語に取る。前置詞 in（中に・で）、für（〜のために）、接続詞 und（と・そして）、dass（〜ということ）。高度な節構造・敬語は未設計。"}],"words":[{"w":"ek","ja":"私","en":"I / me","pos":"代名詞","kana":"エク","ipa":"ek","origin":"既出"},{"w":"dair","ja":"あなた","en":"you","pos":"代名詞","kana":"デア","ipa":"dɛə̯ʁ","origin":"既出"},{"w":"hen","ja":"彼","en":"he / him","pos":"代名詞","kana":"ヘン","ipa":"hen","origin":"既出"},{"w":"schään","ja":"彼女","en":"she / her","pos":"代名詞","kana":"シェーン","ipa":"ʃɛːn","origin":"既出"},{"w":"veir","ja":"私たち","en":"we / us","pos":"代名詞","kana":"ヴァイル","ipa":"vaɪ̯ʁ","origin":"既出"},{"w":"thern","ja":"彼ら","en":"they / them","pos":"代名詞","kana":"セェルン","ipa":"θeʁn","origin":"既出"},{"w":"värn","ja":"人間","en":"human","pos":"名詞","kana":"ヴェルン","ipa":"vɛʁn","origin":"既出"},{"w":"aulden","ja":"世界","en":"world","pos":"名詞","kana":"アウルデン","ipa":"aʊ̯ldən","origin":"既出"},{"w":"stärn","ja":"国家","en":"state","pos":"名詞","kana":"シュテルン","ipa":"ʃtɛʁn","origin":"既出"},{"w":"freith","ja":"自由","en":"freedom","pos":"名詞","kana":"フライス","ipa":"fʁaɪ̯θ","origin":"既出"},{"w":"heiven","ja":"平和","en":"peace","pos":"名詞","kana":"ハイヴェン","ipa":"haɪ̯vən","origin":"既出"},{"w":"zair","ja":"時間","en":"time","pos":"名詞","kana":"ツェア","ipa":"tsɛə̯ʁ","origin":"既出"},{"w":"hald","ja":"家","en":"home","pos":"名詞","kana":"ハルド","ipa":"hald","origin":"既出"},{"w":"leiv","ja":"愛する","en":"love","pos":"動詞","kana":"ライヴ","ipa":"laɪ̯v","origin":"既出"},{"w":"krenst","ja":"知識","en":"knowledge","pos":"名詞","kana":"クレンスト","ipa":"kʁenst","origin":"既出"},{"w":"voren","ja":"未来","en":"future","pos":"名詞","kana":"ヴォレン","ipa":"voʁən","origin":"既出"},{"w":"leven","ja":"生きる","en":"live","pos":"動詞","kana":"レヴェン","ipa":"levən","origin":"既出"},{"w":"vesen","ja":"知る","en":"know","pos":"動詞","kana":"ヴェセン","ipa":"vesən","origin":"既出"},{"w":"trelven","ja":"話す","en":"speak","pos":"動詞","kana":"トレルヴェン","ipa":"tʁelvən","origin":"既出"},{"w":"varden","ja":"守る","en":"protect","pos":"動詞","kana":"ヴァルデン","ipa":"vaʁdən","origin":"既出"},{"w":"schald","ja":"安全","en":"safety","pos":"名詞","kana":"シャルド","ipa":"ʃald","origin":"既出"},{"w":"vracht","ja":"力","en":"strength","pos":"名詞","kana":"ヴラハト","ipa":"vʁaxt","origin":"既出"},{"w":"graust","ja":"大地","en":"land","pos":"名詞","kana":"グラウスト","ipa":"gʁaʊ̯st","origin":"既出"},{"w":"eiren","ja":"希望","en":"hope","pos":"名詞","kana":"アイレン","ipa":"aɪ̯ʁən","origin":"既出"},{"w":"brünt","ja":"血","en":"blood","pos":"名詞","kana":"ブリュント","ipa":"bʁynt","origin":"既出"},{"w":"örn","ja":"空","en":"sky","pos":"名詞","kana":"エルン","ipa":"øʁn","origin":"既出"},{"w":"speld","ja":"言語","en":"language","pos":"名詞","kana":"シュペルド","ipa":"ʃpeld","origin":"既出"},{"w":"reng","ja":"雨","en":"rain","pos":"名詞","kana":"レング","ipa":"ʁeŋ","origin":"既出"},{"w":"ne","ja":"〜ない","en":"not","pos":"助詞","kana":"ネ","ipa":"ne","origin":"既出"},{"w":"und","ja":"そして・と","en":"and","pos":"接続詞","kana":"ウンド","ipa":"und","origin":"既出"},{"w":"für","ja":"〜のために","en":"for","pos":"前置詞","kana":"フュル","ipa":"fyʁ","origin":"既出"},{"w":"thae","ja":"その（定冠詞）","en":"the","pos":"冠詞","kana":"セー","ipa":"θeː","origin":"既出"},{"w":"in","ja":"〜の中に・で","en":"in","pos":"前置詞","kana":"イン","ipa":"in","origin":"既出"},{"w":"sterven","ja":"死ぬ","en":"die","pos":"動詞","kana":"シュテルヴェン","ipa":"ʃteʁvən","origin":"既出"},{"w":"ka","ja":"疑問文の印","en":"question marker","pos":"助詞","kana":"カ","ipa":"ka","origin":"新案"},{"w":"en","ja":"ある一つの（不定冠詞）","en":"a / an","pos":"冠詞","kana":"エン","ipa":"en","origin":"新案"},{"w":"sen","ja":"〜である","en":"be","pos":"動詞","kana":"セン","ipa":"sen","origin":"新案"},{"w":"säl","ja":"こんにちは","en":"hello","pos":"挨拶","kana":"セル","ipa":"sɛl","origin":"新案"},{"w":"tren","ja":"ありがとう","en":"thank you","pos":"挨拶","kana":"トレン","ipa":"tʁen","origin":"新案"},{"w":"ja","ja":"はい","en":"yes","pos":"挨拶","kana":"ヤ","ipa":"ja","origin":"新案"},{"w":"nau","ja":"いいえ","en":"no","pos":"挨拶","kana":"ナウ","ipa":"naʊ̯","origin":"新案"},{"w":"schöven","ja":"さようなら","en":"goodbye","pos":"挨拶","kana":"シェーヴェン","ipa":"ʃøvən","origin":"新案"},{"w":"maren","ja":"食べる","en":"eat","pos":"動詞","kana":"マレン","ipa":"maʁən","origin":"新案"},{"w":"drenen","ja":"飲む","en":"drink","pos":"動詞","kana":"ドレネン","ipa":"dʁenən","origin":"新案"},{"w":"velken","ja":"行く","en":"go","pos":"動詞","kana":"ヴェルケン","ipa":"velkən","origin":"新案"},{"w":"kaven","ja":"来る","en":"come","pos":"動詞","kana":"カヴェン","ipa":"kavən","origin":"新案"},{"w":"serven","ja":"見る","en":"see","pos":"動詞","kana":"セルヴェン","ipa":"seʁvən","origin":"新案"},{"w":"hören","ja":"聞く","en":"hear","pos":"動詞","kana":"ヘーレン","ipa":"høʁən","origin":"新案"},{"w":"lersten","ja":"学ぶ","en":"learn","pos":"動詞","kana":"レルステン","ipa":"leʁstən","origin":"新案"},{"w":"schreiben","ja":"書く","en":"write","pos":"動詞","kana":"シュライベン","ipa":"ʃʁaɪ̯bən","origin":"新案"},{"w":"braven","ja":"読む","en":"read","pos":"動詞","kana":"ブラヴェン","ipa":"bʁavən const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const WORDS=DATA.words;const DICT=Object.fromEntries(WORDS.map(w=>[w.w,w]));const VERBS=WORDS.filter(w=>w.pos==='動詞');const NOUNS=WORDS.filter(w=>w.pos==='名詞');const PRONS=WORDS.filter(w=>w.pos==='代名詞');const ADJS=WORDS.filter(w=>w.pos==='形容詞');const allPhrases=DATA.lessons.flatMap(l=>l.phrases);const KEY='conlang-studio-v01';let stored=true;let progress={known:[],attempts:0,correct:0,done:[],last:null};try{let p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&Array.isArray(p.known)&&Array.isArray(p.done))progress={...progress,...p};}catch(e){stored=false}function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));stored=true}catch(e){stored=false}}
let page='home',lessonIndex=0,flashPool=[],flashIndex=0,flipped=false,flashDirection='con',quiz=[],qidx=0,selected=-1,quizCorrect=0,filter='',part='',mode='build';let activeAudio=null,playRun=0;const navItems=[['home','ホーム'],['lessons','レッスン'],['dictionary','辞書'],['grammar','文法'],['flash','単語カード'],['quiz','練習問題'],['translate','翻訳・作文'],['settings','学習記録']];

function audioBtn(t){return `<button class="audio" data-act="play" data-value="${esc(t)}" aria-label="${esc(t)} の発音">▶ 音声</button>`}function play(t){let seq=AUDIO[t]?[t]:t.toLowerCase().match(/[a-zäöü]+/g)||[];let missing=seq.filter(k=>!AUDIO[k]);if(missing.length){alert('未登録の音声：'+missing.join(', '));return}let run=++playRun;if(activeAudio)activeAudio.pause();function next(i){if(run!==playRun||i>=seq.length)return;activeAudio=new Audio('data:audio/mpeg;base64,'+AUDIO[seq[i]]);activeAudio.onended=()=>next(i+1);activeAudio.play().catch(()=>{if(run===playRun)alert('音声を再生できません。ブラウザの再生設定を確認してください。')})}next(0)}
function top(e,t,d=''){return `<div class="top"><div><div class="eyebrow">${esc(e)}</div><h1>${esc(t)}</h1>${d?`<p class="lead">${esc(d)}</p>`:''}</div><span class="tag">v0.1</span></div>`}function pbar(p){return `<div class="bar" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>`}function btn(t,act,val='',cls='primary'){return `<button class="${cls}" data-act="${act}" data-value="${esc(val)}">${esc(t)}</button>`}function wordRow(w){let known=progress.known.includes(w.w);return `<div class="word"><div><strong>${esc(w.w)}</strong><small>${esc(w.kana)} · /${esc(w.ipa)}/</small></div><div class="meaning">${esc(w.ja)}<small>${esc(w.en)} · ${esc(w.pos)} <span class="origin">${esc(w.origin)}</span></small></div><div class="word-controls">${audioBtn(w.w)}${btn(known?'✓ 覚えた':'覚える','known',w.w,'secondary tiny')}</div></div>`}function phraseRow(p){return `<div class="phrase"><div><strong>${esc(p[0])}</strong><small>${esc(p[1])}</small></div>${audioBtn(p[0])}</div>`}function known(w,force){let has=progress.known.includes(w);if(force===true&&!has||force===undefined&&!has)progress.known.push(w);else if(force===false||force===undefined&&has)progress.known=progress.known.filter(x=>x!==w);save()}
function home(){let pct=progress.known.length/WORDS.length*100;let next=DATA.lessons.findIndex((_,i)=>!progress.done.includes(i));if(next<0)next=0;return top('LEARNING HOME','Säl! 学習を始めよう。','独自言語の基礎から、会話と作文まで。まずは短い言葉を覚えよう。')+`<div class="stack"><div class="grid3"><div class="metric"><small>覚えた単語</small><strong>${progress.known.length}<small> / ${WORDS.length}</small></strong></div><div class="metric"><small>完了レッスン</small><strong>${progress.done.length}<small> / ${DATA.lessons.length}</small></strong></div><div class="metric"><small>問題の正答率</small><strong>${progress.attempts?Math.round(progress.correct/progress.attempts*100)+'%':'—'}</strong></div></div><div class="panel"><div class="between"><div><div class="eyebrow">YOUR NEXT STEP</div><h2>${esc(DATA.lessons[next].title)}</h2><p class="muted">${esc(DATA.lessons[next].subtitle)}</p></div>${btn('レッスンを開く','lesson',next)}</div>${pbar(pct)}<small>登録語彙の ${Math.round(pct)}% を「覚えた」に登録</small></div><div class="grid2"><div class="panel stack"><div><div class="eyebrow">DAILY PRACTICE</div><h2>単語を復習する</h2><p class="muted">意味を思い出してから裏返す。未習得語を優先。</p></div>${btn('単語カードへ','go','flash')}</div><div class="panel stack"><div><div class="eyebrow">CHECK YOURSELF</div><h2>10問の練習</h2><p class="muted">語彙・訳・発音をランダムに確認。</p></div>${btn('練習を始める','newquiz','','secondary')}</div></div><div class="panel"><div class="eyebrow">LISTEN & REPEAT</div><h2>今日のフレーズ</h2>${phraseRow(allPhrases[progress.known.length%allPhrases.length])}<p class="notice">音声はドイツ語系エンジンを用いた近似。正式な発音は文法・辞書の IPA を参照。</p></div><div class="note">新案の語彙・文法は v0.1 の学習用規則として固定しています。過去の演説には未登録の試作語が含まれるため、まだ教材には使用しません。</div></div>`}
function lessons(){return top('COURSE / 01','基礎コース','全6レッスン。音声を聞き、単語を覚え、練習問題で定着させる。')+`<div class="stack">${DATA.lessons.map((l,i)=>`<div class="panel lesson"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(l.title)} ${progress.done.includes(i)?' · 完了':''}</h3><p>${esc(l.subtitle)} · ${l.words.length}語</p></div>${btn('開く','lesson',i,'secondary')}</div>`).join('')}</div>`}

function dictionary(){return top('LEXICON','辞書','人工言語・日本語・英語・IPAから検索できる。')+`<div class="panel stack"><div class="search"><input id="search" type="search" placeholder="単語や意味を検索…" value="${esc(filter)}" aria-label="辞書検索"><select id="part" aria-label="品詞"><option value="">すべての品詞</option>${[...new Set(WORDS.map(w=>w.pos))].map(p=>`<option ${part===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div id="dictResults">${dictResults()}</div></div>`}function dictResults(){let q=filter.trim().toLowerCase(),rows=WORDS.filter(w=>(!part||part===w.pos)&&(!q||[w.w,w.ja,w.en,w.kana,w.ipa].some(x=>x.toLowerCase().includes(q))));return `<div class="between"><small>${rows.length} 語</small><small>既出 / 新案 を表示</small></div>${rows.map(wordRow).join('')||'<p class="muted spaced">該当する登録語がありません。</p>'}`}
function grammar(){return top('REFERENCE','文法と発音','ルールを確認しながら、文章を組み立てる。')+`<div class="stack"><div class="panel"><div class="eyebrow">ALPHABET</div><h2>26文字</h2><div class="alphabet spaced">${DATA.alphabet.split(' ').map(c=>`<div>${c}<small>${c.toLowerCase()}</small></div>`).join('')}</div></div><div class="panel"><h2>公式学習ルール v0.1</h2>${DATA.rules.map(r=>`<div class="rule"><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p></div>`).join('')}</div><div class="panel"><h2>発音の違いを聞く</h2>${['leiv','dair','waas','örn','brünt','stärn','speld','freith','vracht','reng'].map(w=>wordRow(DICT[w])).join('')}<p class="notice">合成音では語末の有声子音や th、R などが規則通りにならない場合があります。IPAを優先してください。</p></div></div>`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function initFlash(all=false){let u=WORDS.filter(w=>!progress.known.includes(w.w));flashPool=shuffle(all||!u.length?WORDS:u).slice(0,20);flashIndex=0;flipped=false}function flash(){if(flashIndex>=flashPool.length)return top('FLASHCARDS','復習完了')+`<div class="panel cardcenter"><h2>${flashPool.length}枚の復習が終了</h2><p>覚えた単語は ${progress.known.length} 語です。</p>${btn('次の20枚','resetflash')}</div>`;let w=flashPool[flashIndex],jp=flashDirection==='jp';return top('FLASHCARDS','単語カード','答えを思い出してからカードを裏返す。')+`<div class="stack"><div class="between"><div class="tabs">${btn('人工言語 → 日本語','flashdir','con','chip '+(!jp?'active':''))}${btn('日本語 → 人工言語','flashdir','jp','chip '+(jp?'active':''))}</div><small>${flashIndex+1} / ${flashPool.length}</small></div><div class="panel">${pbar(flashIndex/flashPool.length*100)}<div class="cardcenter"><small>${esc(w.pos)}</small><div class="bigword">${esc(jp?w.ja:w.w)}</div>${!jp?audioBtn(w.w):''}<div class="flashanswer">${flipped?`<h2>${esc(jp?w.w:w.ja)}</h2><p class="muted">${esc(w.kana)} · /${esc(w.ipa)}/</p>${jp?audioBtn(w.w):''}`:btn('答えを表示','flip','','secondary')}</div></div>${flipped?`<div class="grid2">${btn('まだ覚えていない','flashnext','no','secondary')}${btn('覚えた','flashnext','yes')}</div>`:''}</div><div class="actions">${btn('未習得から選び直す','resetflash','','secondary')}${btn('全語から選び直す','resetflash','all','secondary')}</div></div>`}
function uniqueOptions(correct,others){let seen=new Set([correct]),d=[];for(let x of shuffle(others)){if(!seen.has(x)){seen.add(x);d.push(x)}if(d.length===3)break}return shuffle([correct,...d])}
function initQuiz(li=null){let pool=li===null?WORDS:DATA.lessons[li].words.map(w=>DICT[w]);let n=li===null?10:Math.min(10,pool.length+2);quiz=[];let ws=shuffle(pool);for(let i=0;i<n;i++){let w=ws[i%ws.length],kind=i%4,others=WORDS.filter(a=>a.w!==w.w);if(kind===0){quiz.push({prompt:w.w,sub:'日本語の意味を選ぶ',answer:w.ja,options:uniqueOptions(w.ja,others.map(x=>x.ja)),audio:w.w,ex:w.w+' = '+w.ja})}else if(kind===1){quiz.push({prompt:w.ja,sub:'人工言語の単語を選ぶ',answer:w.w,options:uniqueOptions(w.w,others.map(x=>x.w)),ex:w.w+' = '+w.ja})}else if(kind===2){let ps=li===null?allPhrases:DATA.lessons[li].phrases;let p=ps[Math.floor(i/4)%ps.length];quiz.push({prompt:p[0],sub:'文章の意味を選ぶ',answer:p[1],options:uniqueOptions(p[1],allPhrases.map(x=>x[1])),audio:p[0],ex:p[0]+' = '+p[1]})}else{quiz.push({prompt:'音声を聞いて答える',sub:'聞こえた単語を選ぶ',answer:w.w,options:uniqueOptions(w.w,others.map(x=>x.w)),audio:w.w,ex:w.w+' = '+w.ja})}}qidx=0;selected=-1;quizCorrect=0;}
function quizView(){if(qidx>=quiz.length)return top('PRACTICE','練習結果')+`<div class="panel cardcenter"><div class="eyebrow">RESULT</div><div class="bigword">${quizCorrect} / ${quiz.length}</div><h2>${Math.round(quizCorrect/quiz.length*100)}% 正解</h2><p class="muted">累計正答率 ${progress.attempts?Math.round(progress.correct/progress.attempts*100):0}%</p>${btn('新しい問題に挑戦','newquiz')}${btn('ホームに戻る','go','home','secondary')}</div>`;let q=quiz[qidx],picked=selected>=0,ok=picked&&q.options[selected]===q.answer;return top('PRACTICE','練習問題','選択した回答はすぐに採点される。')+`<div class="panel stack"><div class="between"><small>問題 ${qidx+1} / ${quiz.length}</small><small>${quizCorrect} 正解</small></div>${pbar(qidx/quiz.length*100)}<div class="cardcenter" style="min-height:125px"><small>${esc(q.sub)}</small><h2>${esc(q.prompt)}</h2>${q.audio?audioBtn(q.audio):''}</div><div class="options">${q.options.map((x,i)=>`<button class="option ${picked&&x===q.answer?'right':picked&&i===selected?'wrong':''}" data-act="answer" data-value="${i}" ${picked?'disabled':''}>${esc(x)}</button>`).join('')}</div>${picked?`<div class="feedback ${ok?'':'bad'}">${ok?'正解。':'正解は '+esc(q.answer)+'。'} ${esc(q.ex)}</div>${btn(qidx===quiz.length-1?'結果を見る':'次の問題','quiznext')}`:''}</div>`}
const stem=w=>w.endsWith('en')&&w.length>3?w.slice(0,-2):w;const inflect=(w,t)=>t==='now'?w:stem(w)+({past:'ed',future:'ar',progress:'ing'}[t]||'');const VFORMS={};for(let v of VERBS){for(let t of ['now','past','future','progress'])VFORMS[inflect(v.w,t)]={v,t}}const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;const jpSub=w=>DICT[w]?.ja||w;const japaneseVerb={leiv:['愛している','愛した','愛するだろう','愛している','愛さない'],leven:['生きる','生きた','生きるだろう','生きている','生きない'],vesen:['知っている','知った','知るだろう','知っている','知らない'],trelven:['話す','話した','話すだろう','話している','話さない'],varden:['守る','守った','守るだろう','守っている','守らない'],sterven:['死ぬ','死んだ','死ぬだろう','死にかけている','死なない'],sen:['である','だった','であるだろう','である','ではない'],maren:['食べる','食べた','食べるだろう','食べている','食べない'],drenen:['飲む','飲んだ','飲むだろう','飲んでいる','飲まない'],velken:['行く','行った','行くだろう','向かっている','行かない'],kaven:['来る','来た','来るだろう','来つつある','来ない'],serven:['見る','見た','見るだろう','見ている','見ない'],hören:['聞く','聞いた','聞くだろう','聞いている','聞かない'],lersten:['学ぶ','学んだ','学ぶだろう','学んでいる','学ばない'],schreiben:['書く','書いた','書くだろう','書いている','書かない'],braven:['読む','読んだ','読むだろう','読んでいる','読まない'],hafen:['持つ','持った','持つだろう','持っている','持たない']};const transitive=new Set(['leiv','vesen','trelven','varden','maren','drenen','serven','hören','lersten','schreiben','braven','hafen']);
function selectHtml(id,items){return `<select id="${id}">${items.map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join('')}</select>`}function field(id,label,contents){return `<div class="field"><label for="${id}">${label}</label>${contents}</div>`}function translate(){return top('LANGUAGE TOOLS','翻訳・作文','辞書に基づく簡易翻訳と文の組み立て。')+`<div class="stack"><div class="tabs">${btn('作文ビルダー','trmode','build','chip '+(mode==='build'?'active':''))}${btn('文章を翻訳','trmode','text','chip '+(mode==='text'?'active':''))}</div><div class="panel stack">${mode==='build'?`<div class="grid2">${field('sub','主語',selectHtml('sub',PRONS.map(w=>[w.w,w.w+' — '+w.ja])))}${field('verb','動詞',selectHtml('verb',VERBS.map(w=>[w.w,w.w+' — '+w.ja])))}${field('obj','目的語・補語',selectHtml('obj',[['','なし'],...[...PRONS,...NOUNS,...ADJS].map(w=>[w.w,w.w+' — '+w.ja])]))}${field('tense','時制',selectHtml('tense',[['now','現在'],['past','過去'],['future','未来'],['progress','現在進行']]))}</div><div class="actions"><label class="check"><input id="negative" type="checkbox">否定</label><label class="check"><input id="question" type="checkbox">疑問</label></div><div class="output" id="out" aria-live="polite"></div>`:`${field('direction','翻訳方向',selectHtml('direction',[['auto','自動判定'],['jp','日本語 → 人工言語'],['con','人工言語 → 日本語']]))}<textarea id="trtext" placeholder="例：私は水を飲む。 / Ek drenen waas." aria-label="翻訳する文章"></textarea><div class="actions">${btn('翻訳する','dotranslate')}</div><div class="output" id="out" aria-live="polite"><small>翻訳結果がここに表示されます。</small></div>`}<div class="note">対応範囲：基本SVO文・定型文・登録単語、現在・過去・未来・進行の一部。複雑な日本語、未登録語、長文は翻訳できません。未対応の文章から単語を勝手に作りません。</div></div></div>`}
function sentenceJP(sub,verb,obj,t,neg,q){let arr=japaneseVerb[verb];if(!arr)return '';let pred=arr[neg?4:{now:0,past:1,future:2,progress:3}[t]];if(neg&&t!=='now')return '';let o=obj?(DICT[obj]?.ja||obj):'';return jpSub(sub)+'は'+(verb==='sen'?o:o?o+'を':'')+pred+(q?'か？':'。')}
function build(){let s=$('sub').value,v=$('verb').value,o=$('obj').value,t=$('tense').value,n=$('negative').checked,q=$('question').checked;let adj=ADJS.some(a=>a.w===o);if((v==='sen'&&(!o||PRONS.some(x=>x.w===o)))||(v==='sen'&&t==='progress')||(!transitive.has(v)&&v!=='sen'&&o)||(v!=='sen'&&adj)){ $('out').innerHTML='<p>この組み合わせは基礎文法の対象外です。目的語・時制を変更してください。</p>';return}let c=cap([q?'ka':'',s,n?'ne':'',inflect(v,t),o].filter(Boolean).join(' '))+(q?'?':'.');let j=sentenceJP(s,v,o,t,n,q);$('out').innerHTML=`<strong>${esc(c)}</strong><p>${esc(j||'この時制の日本語訳は未対応')}</p><div class="spaced">${audioBtn(c)}</div>`}
function norm(s){return s.trim().replace(/[。！？!?．.、,\s]+$/u,'').trim().toLowerCase()}function byJ(s){return s.replace(/[\s。！？!?．.、,]/gu,'')}
function translateText(text,direction){let s=text.trim();if(!s)return null;let jp=direction==='jp'||direction==='auto'&&/[\u3040-\u30ff\u3400-\u9fff]/u.test(s);if(jp){for(let [c,j] of allPhrases)if(byJ(j)===byJ(s))return {main:c,sub:j,audio:c};let d=WORDS.find(w=>byJ(w.ja)===byJ(s)||w.ja.split('・').includes(byJ(s)));if(d)return {main:d.w,sub:d.ja,audio:d.w};let q=/[？?]$|か[。？?]?$/u.test(s);let clean=byJ(s).replace(q?/か$/u:/$^/,'');for(let p of PRONS){if(!clean.startsWith(p.ja+'は'))continue;let rem=clean.slice(p.ja.length+1);for(let v of VERBS){let a=japaneseVerb[v.w];for(let [i,t] of ['now','past','future','progress','now'].entries()){let pred=a[i];if(!rem.endsWith(pred))continue;let ob=rem.slice(0,-pred.length),o='';if(ob){if(v.w!=='sen'){if(!ob.endsWith('を')||!transitive.has(v.w))continue;ob=ob.slice(0,-1)}let d=WORDS.find(w=>w.ja===ob&&['名詞','代名詞','形容詞'].includes(w.pos));if(!d)continue;o=d.w}else if(v.w==='sen')continue;let c=cap([q?'ka':'',p.w,i===4?'ne':'',inflect(v.w,t),o].filter(Boolean).join(' '))+(q?'?':'.');return {main:c,sub:s,audio:c}}}}return null}else{for(let [c,j] of allPhrases)if(norm(c)===norm(s))return {main:j,sub:c,audio:c};let d=DICT[norm(s)];if(d)return {main:d.ja,sub:d.w,audio:d.w};let tokens=norm(s).split(/\s+/);let q=tokens[0]==='ka';if(q)tokens.shift();if(tokens.length<2)return null;let sub=tokens.shift();if(!PRONS.some(w=>w.w===sub))return null;let neg=tokens[0]==='ne';if(neg)tokens.shift();let vf=VFORMS[tokens.shift()];if(!vf||tokens.length>1)return null;let o=tokens[0]||'';if(o&&!DICT[o])return null;if(o&&(!transitive.has(vf.v.w)&&vf.v.w!=='sen'))return null;let j=sentenceJP(sub,vf.v.w,o,vf.t,neg,q);return j?{main:j,sub:s,audio:s}:null}}
function settings(){return top('YOUR DATA','学習記録','このブラウザ内に保存される学習記録を管理する。')+`<div class="stack"><div class="grid3"><div class="metric"><small>習得語数</small><strong>${progress.known.length}</strong></div><div class="metric"><small>解答数</small><strong>${progress.attempts}</strong></div><div class="metric"><small>正解数</small><strong>${progress.correct}</strong></div></div><div class="panel stack"><h2>保存とバックアップ</h2><p>${stored?'ブラウザのローカル保存が利用可能です。':'このブラウザではローカル保存を利用できません。'} 別の端末へ移る場合や、ブラウザがローカルファイルの保存を制限する場合はバックアップを利用してください。</p><div class="actions">${btn('学習記録を書き出す','export','','secondary')}${btn('学習記録を読み込む','import','','secondary')}${btn('辞書・文法を書き出す','exportdict','','secondary')}</div><input id="importfile" type="file" accept="application/json,.json" class="hide"><p class="notice">最終練習：${progress.last?esc(new Date(progress.last).toLocaleString('ja-JP')):'まだありません'}</p></div><div class="panel stack"><h2>習得済みの単語</h2>${progress.known.length?WORDS.filter(w=>progress.known.includes(w.w)).map(wordRow).join(''):'<p class="muted">まだありません。</p>'}</div><div class="panel"><div class="between"><div><h3>学習記録のリセット</h3><small>保存された進捗をすべて消します。</small></div>${btn('リセット','reset','','secondary')}</div></div></div>`}
function render(){ $('nav').innerHTML=navItems.map(([p,t])=>`<button data-act="go" data-value="${p}" class="${page===p||page==='lesson'&&p==='lessons'?'active':''}">${t}</button>`).join('');$('main').innerHTML=({home,lessons,lesson,dictionary,grammar,flash,quiz:quizView,translate,settings}[page]||home)();if(page==='dictionary'){$('search').oninput=e=>{filter=e.target.value;$('dictResults').innerHTML=dictResults()};$('part').onchange=e=>{part=e.target.value;$('dictResults').innerHTML=dictResults()}}if(page==='translate'&&mode==='build'){$('obj').value='dair';for(let id of ['sub','verb','obj','tense','negative','question'])$(id).onchange=build;build()}if(page==='settings'){$('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text());if(!Array.isArray(p.known)||!Array.isArray(p.done)||!Number.isInteger(p.attempts)||!Number.isInteger(p.correct)||p.correct<0||p.attempts<p.correct)throw Error();progress={known:[...new Set(p.known.filter(w=>DICT[w]))],done:[...new Set(p.done.filter(i=>Number.isInteger(i)&&i>=0&&i<DATA.lessons.length))],attempts:p.attempts,correct:p.correct,last:typeof p.last==='string'&&!isNaN(Date.parse(p.last))?p.last:null};save();render()}catch{alert('学習記録のJSONファイルが正しくありません。')}}}}
function download(name,o){let u=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.value;switch(a){case'go':show(v);break;case'lesson':lessonIndex=+v;show('lesson');break;case'known':known(v);if(page==='dictionary')$('dictResults').innerHTML=dictResults();else render();break;case'play':play(v);break;case'complete':{let i=+v;progress.done=progress.done.includes(i)?progress.done.filter(x=>x!==i):[...progress.done,i];save();render();break}case'flip':flipped=true;render();break;case'flashdir':flashDirection=v;flipped=false;render();break;case'flashnext':known(flashPool[flashIndex].w,v==='yes');flashIndex++;flipped=false;render();break;case'resetflash':initFlash(v==='all');render();break;case'newquiz':initQuiz();show('quiz');break;case'lessonquiz':initQuiz(+v);show('quiz');break;case'answer':if(selected!==-1)break;selected=+v;progress.attempts++;if(quiz[qidx].options[selected]===quiz[qidx].answer){quizCorrect++;progress.correct++}progress.last=new Date().toISOString();save();render();break;case'quiznext':qidx++;selected=-1;render();break;case'trmode':mode=v;render();break;case'dotranslate':{let r=translateText($('trtext').value,$('direction').value);$('out').innerHTML=r?`<strong>${esc(r.main)}</strong><p class="muted">${esc(r.sub)}</p><div class="spaced">${audioBtn(r.audio)}</div>`:'<p>対応する登録語・文型が見つかりません。短い基本文を試してください。</p>';break}case'export':download('conlang_progress.json',progress);break;case'exportdict':download('conlang_dictionary_v01.json',DATA);break;case'import':$('importfile').click();break;case'reset':if(confirm('学習記録をすべて削除しますか？')){progress={known:[],attempts:0,correct:0,done:[],last:null};save();flashPool=[];quiz=[];render()}break}});render();
</script></body></html>
